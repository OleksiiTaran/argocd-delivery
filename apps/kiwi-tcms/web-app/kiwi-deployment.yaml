apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwi-tcms
  namespace: testing
spec:
  selector:
    matchLabels:
      app: kiwi-tcms
  template:
    metadata:
      labels:
        app: kiwi-tcms
      annotations:
        force-update/timestamp: "2026-07-23"
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kiwi-mariadb 3306; do echo "waiting for database..."; sleep 2; done;']
      containers:
        - name: kiwi-tcms
          image: kiwitcms/kiwi:latest
          imagePullPolicy: Always
          env:
            - name: KIWI_DB_HOST
              value: "kiwi-mariadb"
            - name: KIWI_DB_NAME
              value: "kiwidb"
            - name: KIWI_DB_USER
              value: "kiwiuser"
            - name: KIWI_DB_PASSWORD
              value: "kiwipass"
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: kiwi-uploads
              mountPath: /Kiwi/uploads
      volumes:
        - name: kiwi-uploads
          persistentVolumeClaim:
            claimName: kiwi-uploads-pvc