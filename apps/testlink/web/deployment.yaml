apiVersion: apps/v1
kind: Deployment
metadata:
  name: testlink
spec:
  selector:
    matchLabels:
      app: testlink
  template:
    metadata:
      labels:
        app: testlink
    spec:
      containers:
        - name: testlink
          image: tminai/testlink:latest
          env:
            - name: DB_HOST
              value: "mariadb"
            - name: DB_USER
              value: "testlink_user"
            - name: DB_PASSWORD
              value: "testlink_password"
            - name: DB_NAME
              value: "testlink_db"
          ports:
            - containerPort: 80